<section class="container py-4">
  <div class="row g-3">
    @for (c of lista; track c.nome) {
      <div class="col-6 col-md-4 col-lg-2">
                        <a href="vitrine?categoria={{ c.nome }}"
           class="card h-100 text-center text-decoration-none card-cat"
           [style.border]="'3px solid ' + c.borda">
          <img [src]="c.img" [alt]="c.nome" class="sprite card-img-top">
          <div class="card-body p-3" [style.background]="c.cor">
            <h6 class="card-title fw-bold mb-1">{{ c.nome }}</h6>
            <small class="text-secondary">{{ c.desc }}</small>
          </div>
        </a>
      </div>
    }
  </div>
</section>
