<section class="beneficios">
  <div class="container">
    <div class="row g-3 py-4">
      @for (b of itens; track b.titulo) {
        <div class="col-6 col-lg-3 d-flex align-items-center gap-3">
          <span class="icone"><i [class]="'bi ' + b.icone"></i></span>
          <div>
            <strong>{{ b.titulo }}</strong>
            <small>{{ b.texto }}</small>
          </div>
        </div>
      }
    </div>
  </div>
</section>
